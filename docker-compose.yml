# Toàn bộ hệ thống: cp .env.example .env (bắt buộc đặt JWT_SECRET) rồi `docker compose up -d --build`.
# FE chỉ gọi api-gateway (http://localhost:${GATEWAY_PORT:-9090}). ai-service đọc API_KEY / GROQ_QWEN_MODEL từ ai-service/.env.
name: chatbot-hsu

services:
  # ── Hạ tầng ──────────────────────────────────────────────────────────────────
  postgres-auth:
    image: postgres:16-alpine
    container_name: hsu-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-change_me_auth_db}
    ports:
      - "5436:5432"   # 5432 thường bị Postgres cài sẵn trên máy chiếm
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DB riêng của account-service (bảng users). auth-service không truy cập DB này mà gọi account-service qua gRPC.
  postgres-account:
    image: postgres:16-alpine
    container_name: hsu-postgres-account
    restart: unless-stopped
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: ${ACCOUNT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:-change_me_account_db}
    ports:
      - "5437:5432"
    volumes:
      - account_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-file:
    image: postgres:17-alpine
    container_name: file-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-file_service}
      POSTGRES_USER: ${POSTGRES_USER:-file_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: file-service-rabbitmq
    # Dữ liệu RabbitMQ gắn với hostname, cố định để không mất hàng đợi khi tạo lại container
    hostname: file-service-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-file_service}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
    ports:
      - "5672:5672"
      - "15672:15672"   # Giao diện quản trị: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # minio/minio đã bị gỡ khỏi Docker Hub và Quay; dùng bản Chainguard (miễn phí, chỉ có tag latest)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: file-service-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-file_service}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-file_service_secret}
    ports:
      - "9000:9000"
      - "9001:9001"   # Giao diện quản trị: http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: kltn-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  mongodb:
    image: mongo:8
    container_name: hsu-mongodb
    restart: unless-stopped
    ports:
      # Chỉ loopback, và cổng 27018 (không phải 27017) vì MongoDB cài sẵn trên máy host hay chiếm 27017: kết nối từ host tới đó sẽ không vào container
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-hsu}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me_mongo}
    # ai-service trong mạng compose vào thẳng mongodb:27017; cổng publish ở trên chỉ để Compass / test từ máy host
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Ứng dụng ─────────────────────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: hsu-auth-service
    restart: unless-stopped
    depends_on:
      postgres-auth:
        condition: service_healthy
      account-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-change_me_auth_db}
      APPLICATION_JWT_SECRET_KEY: ${JWT_SECRET:?đặt JWT_SECRET (>= 32 ký tự) trong .env}
      GRPC_SERVER_PORT: 9091
      ACCOUNT_GRPC_HOST: account-service   # gọi account-service (lấy tài khoản, mật khẩu đã băm, token_version)
      ACCOUNT_GRPC_PORT: 9092
    ports:
      - "8081:8081"   # REST
      - "9091:9091"   # gRPC (gateway validate token)

  # REST (8082) chỉ api-gateway gọi tới, gRPC (9092) chỉ auth-service gọi tới: tin header X-User-Role / không xác thực gRPC
  # nên KHÔNG publish cổng nào ra host.
  account-service:
    build: ./account-service
    container_name: hsu-account-service
    restart: unless-stopped
    depends_on:
      postgres-account:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5432/account_db
      SPRING_DATASOURCE_USERNAME: ${ACCOUNT_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD:-change_me_account_db}
      APP_SEED_ENABLED: ${ACCOUNT_SEED_ENABLED:-${AUTH_SEED_ENABLED:-false}}   # AUTH_SEED_ENABLED: tên cũ, vẫn nhận
      AUTH_GRPC_HOST: auth-service   # gọi auth-service để băm/so khớp mật khẩu (không khai depends_on vì auth-service đã phụ thuộc account-service)
      AUTH_GRPC_PORT: 9091

  file-service:
    build: ./file-service
    image: file-service:latest
    container_name: file-service
    restart: unless-stopped
    depends_on:
      postgres-file:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-file:5432/${POSTGRES_DB:-file_service}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-file_service}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-file_service}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-file_service}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-file_service_secret}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?đặt INTERNAL_TOKEN trong .env}   # /internal/** (ai-service bao ket qua OCR); header X-Internal-Token
    ports:
      - "127.0.0.1:8080:8080"   # chi loopback: file-service khong co xac thuc, ben ngoai di qua api-gateway

  ai-service:
    build: ./ai-service
    image: ai-service:latest
    container_name: kltn-ai-service
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file: ./ai-service/.env   # GROQ_API_KEY, GROQ_QWEN_MODEL, ...
    environment:
      QDRANT_URL: http://qdrant:6333
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?đặt INTERNAL_TOKEN trong .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-file_service}:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/
      FILE_SERVICE_URL: http://file-service:8080
      OCR_VL_URL: http://paddleocr-vl-api:8080   # OCR trang scan: PaddleOCR-VL-1.6 (hai service paddleocr-* bên dưới)
      # Lưu trữ hội thoại (luôn bật). Mật khẩu có ký tự đặc biệt phải URL-encode
      MONGODB_URI: mongodb://${MONGO_USER:-hsu}:${MONGO_PASSWORD:-change_me_mongo}@mongodb:27017/?authSource=admin
    ports:
      - "8001:8000"   # API + Swagger UI (http://localhost:8001/docs); 8000 hay bị uvicorn chạy tay trên máy chiếm
    volumes:
      - hf_cache:/data/hf   # model embedding + reranker (~3GB), tải lần đầu khi có request /ask
      - groq_cache:/data/groq_cache
    # Cần NVIDIA GPU + Docker Desktop (WSL2). Máy không có GPU: xóa khối `deploy` và build bản CPU (xem ai-service/Dockerfile).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── OCR: PaddleOCR-VL-1.6 (pipeline `paddleocr[doc-parser]`, image chính thức của PaddleOCR; cần NVIDIA GPU, driver hỗ trợ CUDA 12.6+) ──
  # ai-service gửi trang scan sang paddleocr-vl-api (POST /layout-parsing): PP-DocLayoutV3 tách layout, VLM 0.9B (paddleocr-vlm-server, vLLM)
  # đọc từng chữ / bảng. Image ~ vài GB mỗi cái, tải lần đầu lâu. PADDLEOCR_IMAGE_TAG=paddleocr3.6-nvidia-gpu-offline để ghim phiên bản.
  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:${PADDLEOCR_IMAGE_TAG:-latest-nvidia-gpu-offline}
    container_name: hsu-paddleocr-vlm
    restart: unless-stopped
    user: root
    shm_size: 8g
    command: paddleocr genai_server --model_name PaddleOCR-VL-1.6-0.9B --host 0.0.0.0 --port 8080 --backend vllm --backend_config /home/paddleocr/vlm_server_config.yaml
    configs:
      - source: vlm_server_config
        target: /home/paddleocr/vlm_server_config.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      start_period: 300s

  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${PADDLEOCR_IMAGE_TAG:-latest-nvidia-gpu-offline}
    container_name: hsu-paddleocr-vl-api
    restart: unless-stopped
    user: root
    shm_size: 8g
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    environment:
      VLM_BACKEND: vllm
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/pipeline_config_vllm.yaml"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - account-service
      - file-service
      - ai-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      FILE_SERVICE_URL: http://file-service:8080
      AI_SERVICE_URL: http://ai-service:8000
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9091
      GATEWAY_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
      GATEWAY_AI_RPS: ${AI_RPS:-10}
      GATEWAY_FILE_RPS: ${FILE_RPS:-20}
      GATEWAY_AUTH_RPS: ${AUTH_RPS:-5}
    ports:
      - "${GATEWAY_PORT:-9090}:9090"

# Cấu hình vLLM của paddleocr-vlm-server (--backend_config). vLLM chiếm trước `gpu-memory-utilization` x tổng VRAM lúc khởi động, nên phải chia
# với ai-service (model embedding + reranker) dùng chung GPU: PaddleOCR khuyến nghị 0.7 cho RTX 3060 12GB; model 0.9B bf16 riêng đã ~1.9GB.
# Đặt OCR_VLM_GPU_UTIL / OCR_VLM_MAX_SEQS trong .env để đổi theo máy.
configs:
  vlm_server_config:
    content: |
      gpu-memory-utilization: ${OCR_VLM_GPU_UTIL:-0.6}
      max-num-seqs: ${OCR_VLM_MAX_SEQS:-16}
      max-num-batched-tokens: ${OCR_VLM_MAX_BATCHED_TOKENS:-131072}

# Tên volume giữ nguyên như các file compose cũ để không mất dữ liệu đã có.
volumes:
  auth_postgres_data:
    name: auth-service_postgres_data
  account_postgres_data:
    name: account-service_postgres_data
  file_postgres_data:
    name: file-service_postgres_data
  rabbitmq_data:
    name: file-service_rabbitmq_data
  minio_data:
    name: file-service_minio_data
  qdrant_storage:
    # QDRANT_VOLUME=model_qdrant_storage nếu đã có dữ liệu index từ trước (xem .env.example)
    name: ${QDRANT_VOLUME:-hsu_qdrant_data}
  mongo_data:
    name: kltn_mongo_data
  hf_cache:
    name: kltn_hf_cache
  groq_cache:
    name: kltn_groq_cache

server.port=8082
# gRPC cho auth-service (lấy tài khoản, mật khẩu đã băm). Không publish ra ngoài.
grpc.server.port=9092
# auth-service: băm/so khớp mật khẩu. Trong container đặt AUTH_GRPC_HOST=auth-service
grpc.client.auth-service.address=static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9091}
grpc.client.auth-service.negotiation-type=plaintext
spring.application.name=account-service

# DB riêng của account-service (nguồn dữ liệu duy nhất về tài khoản). Trong container ghi đè bằng SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5437/account_db
spring.datasource.username=postgres
spring.datasource.password=${ACCOUNT_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed tài khoản mẫu cho dev (xem DataSeeder). Trong container: ACCOUNT_SEED_ENABLED -> APP_SEED_ENABLED.
app.seed.enabled=false

spring.web.error.include-message=always

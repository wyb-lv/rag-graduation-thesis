syntax = "proto3";

package password;

option java_multiple_files = true;
option java_package = "com.example.authservice.grpc";

// Băm và so khớp mật khẩu là việc của auth-service (Spring Security). Account-service gọi sang khi tạo tài khoản,
// đặt lại hoặc đổi mật khẩu. Hai bản giống hệt nhau (account-service/src/main/proto và auth-service/src/main/proto): sửa thì sửa cả hai.
// Mã lỗi: INVALID_ARGUMENT = mật khẩu không băm được (vd quá 72 byte).
service PasswordService {
  rpc Encode (EncodeRequest) returns (EncodeResponse);
  rpc Matches (MatchesRequest) returns (MatchesResponse);
}

message EncodeRequest {
  string raw_password = 1;
}

message EncodeResponse {
  string password_hash = 1;
}

message MatchesRequest {
  string raw_password = 1;
  string password_hash = 2;
}

message MatchesResponse {
  bool matches = 1;
}

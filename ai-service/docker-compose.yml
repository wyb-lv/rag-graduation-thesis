name: rag-graduation-thesis

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: kltn-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  ai-service:
    build: .
    image: ai-service:latest
    container_name: kltn-ai-service
    restart: unless-stopped
    depends_on:
      - qdrant
    env_file: .env   # API_KEY, GROQ_QWEN_MODEL, ...
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"   # API + Swagger UI (http://localhost:8000/docs)
    volumes:
      - hf_cache:/data/hf             # BGE-M3 + jina reranker (~3GB), tai lan dau co request /ask
      - groq_cache:/data/groq_cache
      - ./app:/app/app                # Mount code app trực tiếp để đồng bộ code mới nhất
    # Can NVIDIA GPU + Docker Desktop (WSL2). May khong co GPU (vd macOS): comment khoi `deploy` va build ban CPU (xem Dockerfile).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  qdrant_storage:
    # Volume tao tu khi thu muc con ten "Model" (project compose "model"); giu nguyen de khong mat du lieu da index
    name: model_qdrant_storage
  hf_cache:
    name: kltn_hf_cache
  groq_cache:
    name: kltn_groq_cache

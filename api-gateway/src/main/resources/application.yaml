spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          # ── Auth Service: xác thực & người dùng ─────────────────────────
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/auth/**

          # ── Account Service: quản lý tài khoản (chỉ ADMIN, account-service tự kiểm tra role) ──
          - id: account-service
            uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/accounts, /api/accounts/**

          # ── File Service: quản lý tài liệu ──────────────────────────────
          - id: file-service
            uri: ${FILE_SERVICE_URL:http://localhost:8080}
            predicates:
              - Path=/api/documents/**

          # ── AI Service: hỏi đáp RAG & Giọng nói ─────────────────────────
          - id: ai-service-ask
            uri: ${AI_SERVICE_URL:http://localhost:8000}
            predicates:
              - Path=/api/ai/health, /api/ai/ask, /api/ai/ask/stream, /api/ai/ask/voice/stream, /api/ai/stt, /api/ai/tts, /api/ai/call/**, /api/ai/conversations, /api/ai/conversations/**
            filters:
              - StripPrefix=2
              - RemoveRequestHeader=Origin
              
          # Embed: POST /api/ai/embed → ai-service POST /embed
          # Delete vectors: DELETE /api/ai/embed/{id} → ai-service DELETE /embed/{id}
          - id: ai-service-embed
            uri: ${AI_SERVICE_URL:http://localhost:8000}
            predicates:
              - Path=/api/ai/embed, /api/ai/embed/**
            filters:
              - StripPrefix=2
              - RemoveRequestHeader=Origin
server:
  port: ${SERVER_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: HSU Chatbot API Gateway
    version: 1.0.0
    description: API Gateway proxy cho file-service và ai-service

gateway:
  # Cấu hình rate limiting (in-memory token bucket, mỗi IP)
  rate-limit:
    # Requests per second được phép
    ai-service-rps: ${GATEWAY_AI_RPS:10}
    file-service-rps: ${GATEWAY_FILE_RPS:20}
    auth-service-rps: ${GATEWAY_AUTH_RPS:5}

    # Burst tối đa
    ai-service-burst: ${GATEWAY_AI_BURST:20}
    file-service-burst: ${GATEWAY_FILE_BURST:40}
    auth-service-burst: ${GATEWAY_AUTH_BURST:5}

  # Swagger UI gom tài liệu API của các service tại http://localhost:9090/swagger-ui.html (công khai, không cần token;
  # "Try it out" cần Authorize bằng access token). Triển khai thật nên đặt GATEWAY_DOCS_ENABLED=false.
  docs:
    enabled: ${GATEWAY_DOCS_ENABLED:true}
    sources:
      - name: auth
        title: Auth Service
        url: ${AUTH_SERVICE_URL:http://localhost:8081}/v3/api-docs
        include: [/api/auth]
      - name: accounts
        title: Account Service
        url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}/v3/api-docs
        include: [/api/accounts]
      - name: documents
        title: File Service
        url: ${FILE_SERVICE_URL:http://localhost:8080}/v3/api-docs
        include: [/api/documents]
      - name: ai
        title: AI Service
        url: ${AI_SERVICE_URL:http://localhost:8000}/openapi.json
        path-prefix: /api/ai   # ai-service bị StripPrefix=2 nên spec gốc không có /api/ai
        include: [/api/ai/]

  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.hsu.gateway: DEBUG

grpc:
  client:
    auth-service:
      address: 'static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9091}'
      negotiation-type: plaintext